<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OilsMexico ERP — Iniciando...</title>
<link rel="icon" type="image/png" href="src/OilsMexico.Web/wwwroot/favicon.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter','Segoe UI',system-ui,-apple-system,'Roboto',sans-serif;
    background: linear-gradient(160deg,#0B1220 0%,#12203A 55%,#1D4ED8 135%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1.5rem;
  }
  .card { text-align: center; max-width: 420px; width: 100%;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 2.5rem 2rem; backdrop-filter: blur(6px);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.55); }
  .logo { width: 76px; height: 76px; margin: 0 auto 1.2rem; border-radius: 20px;
    background: #fff; color: #1D4ED8; font-weight: 800; font-size: 2rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px -8px rgba(0,0,0,.45); }
  .logo span { color: #FF7A1A; }
  .spinner { width: 48px; height: 48px; margin: 0 auto 1.2rem; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.22); border-top-color: #FF7A1A;
    animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .35rem; }
  p.sub { font-size: .92rem; color: rgba(255,255,255,.72); margin-bottom: 1.1rem; }
  #estado { font-size: .82rem; color: rgba(255,255,255,.55); min-height: 1.4em; }
  .barra { height: 6px; border-radius: 6px; background: rgba(255,255,255,.15);
    overflow: hidden; margin: 1.1rem 0 .6rem; }
  .barra > div { height: 100%; width: 30%; border-radius: 6px;
    background: linear-gradient(90deg,#FF7A1A,#2563EB);
    animation: desliza 1.4s ease-in-out infinite alternate; }
  @keyframes desliza { from { margin-left: -10%; } to { margin-left: 80%; } }
  #manual { display: none; margin-top: 1rem; }
  #manual a { display: inline-block; background: #FF7A1A; color: #fff; font-weight: 700;
    padding: .6rem 1.4rem; border-radius: 10px; text-decoration: none; }
  #manual small { display: block; margin-top: .7rem; color: rgba(255,255,255,.6); font-size: .78rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">O<span>M</span></div>
    <div class="spinner" role="status" aria-label="Cargando"></div>
    <h1>Cargando... por favor espere</h1>
    <p class="sub">Iniciando OilsMexico ERP</p>
    <div class="barra"><div></div></div>
    <div id="estado">Arrancando el servidor...</div>
    <div id="manual">
      <a href="http://localhost:5200/">Abrir el ERP manualmente</a>
      <small>Si tarda m&aacute;s de un minuto, revise la ventana de la consola: puede haber un error de compilaci&oacute;n o de base de datos.</small>
    </div>
  </div>
<script>
(function () {
  var DESTINO = 'http://localhost:5200/';
  var SONDA = 'http://localhost:5200/health?sonda=';
  var estado = document.getElementById('estado');
  var intentos = 0;
  var mensajes = ['Arrancando el servidor...', 'Compilando la aplicaci\u00f3n...',
    'Conectando a la base de datos...', 'Casi listo...'];
  var rotador = setInterval(function () {
    estado.textContent = mensajes[Math.min(intentos, mensajes.length - 1)];
  }, 4000);
  function sondear() {
    intentos++;
    // mode:'no-cors': la página es un archivo local y Kestrel no envía
    // cabeceras CORS; con no-cors la promesa se resuelve (opaca) en cuanto
    // el servidor responde, y se rechaza solo si no hay conexión.
    fetch(SONDA + Date.now(), { mode: 'no-cors', cache: 'no-store' })
      .then(function () {
        clearInterval(rotador);
        estado.textContent = 'Listo, abriendo el ERP...';
        setTimeout(function () { window.location.replace(DESTINO); }, 400);
      })
      .catch(function () {
        if (intentos > 45) { // ~90 s sin respuesta: mostrar acceso manual
          document.getElementById('manual').style.display = 'block';
          estado.textContent = 'El servidor est\u00e1 tardando m\u00e1s de lo normal.';
        }
        setTimeout(sondear, 2000);
      });
  }
  sondear();
})();
</script>
</body>
</html>
